<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2420" />
    <title>Pocket · Strategy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tracker.css?v=12" />
  </head>
  <body>
    <div class="wrap">
      <header class="bar">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div class="titles">
            <h1>Pocket</h1>
            <p>Strategy</p>
          </div>
        </div>
        <p class="tag">Plan • Track • Deliver</p>
      </header>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="recovery" class="recovery" hidden></div>
      <div class="toolbar">
        <div class="views" role="tablist" aria-label="Sections">
          <button type="button" data-view="projects" aria-selected="true">Projects</button>
          <button type="button" data-view="recommendations" aria-selected="false">Recommendations</button>
          <button type="button" data-view="roadmap" aria-selected="false">Roadmap</button>
        </div>
        <div class="tools">
          <button type="button" data-export>Export</button>
          <button type="button" data-import>Import</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>
      </div>
      <main id="app"></main>
    </div>
    <div id="sheet-root"></div>
    <div id="confirm-root"></div>
    <script src="tracker-model.js?v=11"></script>
    <script src="tracker.js?v=12"></script>
  </body>
</html>
